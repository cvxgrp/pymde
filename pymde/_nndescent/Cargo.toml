[package]
name = "pymde-nndescent"
version = "0.1.0"
edition = "2021"

[lib]
name = "_nndescent"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
numpy = "0.23"
rand = "0.8"
rand_chacha = "0.3"
ordered-float = "4"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
