[build-system]
requires = [
    "setuptools >= 68.0",
    "setuptools-rust >= 1.9",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "pymde"
dynamic = ["version"]
description = "Minimum-Distortion Embedding"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Akshay Agrawal", email = "akshayka@cs.stanford.edu" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "matplotlib",
    "numpy >= 1.17.5",
    "scipy",
    "torch >= 1.7.1",
    "torchvision >= 0.8.2",
    # torchvision requires requests but does not list it as a dependency
    "requests",
]

[project.urls]
Homepage = "https://pymde.org"
Repository = "https://github.com/cvxgrp/pymde"
Issues = "https://github.com/cvxgrp/pymde/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools]
packages = { find = { exclude = ["rust*"] } }

[tool.setuptools.dynamic]
version = { attr = "pymde.__version__" }

[tool.ruff]
line-length = 80
target-version = "py310"

[tool.ruff.lint]
extend-ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.ruff.format]
quote-style = "double"

[[tool.setuptools-rust.ext-modules]]
target = "pymde._native"
path = "rust/Cargo.toml"
binding = "PyO3"

[tool.pytest.ini_options]
testpaths = ["pymde"]
