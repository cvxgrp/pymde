name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          src: pymde/

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: uv pip install --system setuptools "setuptools-rust>=1.10.2" wheel "cython>=3.0" "numpy>=2.0"

      - name: Install CPU PyTorch (macOS)
        if: matrix.os == 'macos-latest'
        run: uv pip install --system torch torchvision

      - name: Install CPU PyTorch (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: uv pip install --system torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install CPU PyTorch (Windows)
        if: matrix.os == 'windows-latest'
        run: uv pip install --system torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install pymde
        run: uv pip install --system -e ".[dev]"

      - name: Test with pytest
        run: pytest -v pymde/
