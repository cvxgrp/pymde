name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          src: pymde/

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v5

      - name: Install OpenBLAS (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y libopenblas-dev

      - name: Install OpenBLAS (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          curl -L -o C:\openblas.zip https://github.com/OpenMathLib/OpenBLAS/releases/download/v0.3.28/OpenBLAS-0.3.28-x64.zip
          7z x C:\openblas.zip -oC:\openblas
          copy C:\openblas\lib\libopenblas.dll.a C:\openblas\lib\openblas.lib
          echo "OPENBLAS_LIB_DIR=C:\openblas\lib" >> $env:GITHUB_ENV

      - name: Install build dependencies
        run: uv pip install --system setuptools setuptools-rust wheel "cython>=3.0" "numpy>=2.0"

      - name: Install CPU PyTorch (macOS)
        if: matrix.os == 'macos-latest'
        run: uv pip install --system torch torchvision

      - name: Install CPU PyTorch (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: uv pip install --system torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install CPU PyTorch (Windows)
        if: matrix.os == 'windows-latest'
        run: uv pip install --system torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install pymde
        run: uv pip install --system -e ".[dev]"

      - name: Copy OpenBLAS DLL next to extension module (Windows)
        if: matrix.os == 'windows-latest'
        run: copy C:\openblas\bin\libopenblas.dll pymde\

      - name: Test with pytest
        run: pytest -v pymde/
