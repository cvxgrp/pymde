name: Build

on:
  workflow_call:
    inputs:
      version:
        description: "When non-empty, patches pymde/__init__.py with this version before building"
        required: false
        default: ""
        type: string

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            aarch64-apple-darwin,
            x86_64-apple-darwin

      - name: Patch version
        if: inputs.version != ''
        shell: bash
        run: |
          sed -i.bak "s/__version__ = \".*\"/__version__ = \"${{ inputs.version }}\"/" pymde/__init__.py
          rm -f pymde/__init__.py.bak
          echo "Patched version to ${{ inputs.version }}"
          grep __version__ pymde/__init__.py

      - name: Set up QEMU
        if: matrix.os == 'ubuntu-latest'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.23.3
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-win32 *-manylinux_i686 *-musllinux*"
          CIBW_ARCHS_LINUX: "x86_64 aarch64"
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          CIBW_ENVIRONMENT_MACOS: 'MACOSX_DEPLOYMENT_TARGET=10.12'
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_BEFORE_ALL_LINUX: >-
            dnf install -y epel-release &&
            dnf install -y openblas-devel &&
            curl https://sh.rustup.rs -sSf | sh -s -- -y --default-toolchain stable
          CIBW_ENVIRONMENT_LINUX: 'PATH="$HOME/.cargo/bin:$PATH"'
          CIBW_BEFORE_ALL_WINDOWS: >-
            curl -L -o C:\openblas.zip https://github.com/OpenMathLib/OpenBLAS/releases/download/v0.3.28/OpenBLAS-0.3.28-x64.zip &&
            7z x C:\openblas.zip -oC:\openblas &&
            copy C:\openblas\lib\libopenblas.dll.a C:\openblas\lib\openblas.lib
          CIBW_BEFORE_BUILD_WINDOWS: "pip install delvewheel"
          CIBW_ENVIRONMENT_WINDOWS: 'OPENBLAS_LIB_DIR=C:\openblas\lib'
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: "delvewheel repair --add-path C:\\openblas\\bin -w {dest_dir} {wheel}"
          CIBW_TEST_COMMAND: "python -c \"from pymde._native import knn_l2; print('ok')\""

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5

      - name: Patch version
        if: inputs.version != ''
        run: |
          sed -i "s/__version__ = \".*\"/__version__ = \"${{ inputs.version }}\"/" pymde/__init__.py
          echo "Patched version to ${{ inputs.version }}"
          grep __version__ pymde/__init__.py

      - name: Build sdist
        run: uvx --from build pyproject-build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-source-distribution
          path: dist/*.tar.gz
